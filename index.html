    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://juyel.vercel.app/#person",
        "name": "Juyel Hushen",
        "url": "https://juyel.vercel.app/",
        "jobTitle": "Software Engineer",
        "sameAs": [
          "https://github.com/juyelhushen",
          "https://www.linkedin.com/in/juyel-h-770674170/"
        ],
        "knowsAbout": ["Backend development", "Software engineering"]
      }
    </script>
    <script>
      (() => {
        const root = document.documentElement;
        try {
          const theme = window.localStorage.getItem('portfolio-theme');
          const accent = window.localStorage.getItem('portfolio-accent');
          if (theme === 'dark' || theme === 'light') root.dataset.theme = theme;
          if (['cyan', 'violet', 'green', 'amber', 'rose'].includes(accent)) {
            root.dataset.accent = accent;
          }
        } catch {
          root.dataset.theme = 'dark';
          root.dataset.accent = 'cyan';
        }
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', root.dataset.theme === 'light' ? '#fcfcfd' : '#080d1b');
      })();
    </script>
    <script>
      window.addEventListener(
        'error',
        (event) => {
          const target = event.target;
          if (target instanceof HTMLScriptElement && target.type === 'module') {
            const message = document.getElementById('startup-error');
            if (message) message.hidden = false;
          }
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="startup-error" role="alert" hidden>The portfolio could not start</div>
    <div id="root"></div>
    <noscript>
      <main class="no-script">

    </noscript>
    <script type="module" src="/src/main.tsx"></script>
