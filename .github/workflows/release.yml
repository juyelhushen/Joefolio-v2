name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate-release-tag.mjs "$RELEASE_TAG"

      - name: Verify tag points to the triggering commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          remote_tag_commit="$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" |
            awk -v tag="refs/tags/$RELEASE_TAG" '$2 == tag "^{}" { commit = $1 } $2 == tag && !commit { commit = $1 } END { print commit }')"
          if [ "$remote_tag_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag does not point to the commit that triggered this workflow."
            exit 1
          fi

  release-quality:
    name: Release quality checks
    needs: validate-release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

  deploy-production:
    name: Deploy tagged commit to Vercel production
    needs: [validate-release-tag, release-quality]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Verify Vercel deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is required to deploy a release."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::VERCEL_ORG_ID is required to deploy a release."
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_PROJECT_ID is required to deploy a release."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.4.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.4.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.4.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  create-draft-release:
    name: Create draft GitHub Release
    needs: deploy-production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}

      - name: Verify pushed tag still points to the triggering commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          remote_tag_commit="$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" |
            awk -v tag="refs/tags/$RELEASE_TAG" '$2 == tag "^{}" { commit = $1 } $2 == tag && !commit { commit = $1 } END { print commit }')"
          if [ "$remote_tag_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag no longer points to the commit that triggered this workflow."
            exit 1
          fi

      - name: Create draft release if one does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --draft \
            --title "$RELEASE_TAG" \
            --generate-notes
